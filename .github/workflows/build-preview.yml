name: Build WinServiceManager preview

on:
  push:
    branches:
      - feature/dark-ui-service-details
      - feature/window-settings-favorites
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Enable MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Compile Release
        shell: pwsh
        run: |
          msbuild WinServiceManager.sln /m /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU" /p:WarningLevel=4 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'bin/Release/WinServiceManager.exe')) { throw 'Missing executable' }
      - name: Regression - dismiss dark dropdown without crashing
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET/Framework/v4.0.30319/csc.exe'
          & $csc /nologo /target:exe /out:bin/Release/DropdownDismissalSmoke.exe /r:bin/Release/WinServiceManager.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll './Tests\DropdownDismissalSmoke.cs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./bin/Release/DropdownDismissalSmoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Regression - startup list paints once with double buffering
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET/Framework/v4.0.30319/csc.exe'
          & $csc /nologo /target:exe /out:bin/Release/StartupGridSmoke.exe /r:bin/Release/WinServiceManager.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.ServiceProcess.dll './Tests\StartupGridSmoke.cs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./bin/Release/StartupGridSmoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Regression - settings and favorites
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET/Framework/v4.0.30319/csc.exe'
          & $csc /nologo /target:exe /out:bin/Release/SettingsFavoritesSmoke.exe /r:bin/Release/WinServiceManager.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.ServiceProcess.dll './Tests\SettingsFavoritesSmoke.cs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./bin/Release/SettingsFavoritesSmoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify EXE icon and Explorer version metadata
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'bin/Release/WinServiceManager.exe').Path
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($version.FileVersion -ne '1.1.2.0') { throw "Unexpected file version: $($version.FileVersion)" }
          if ($version.ProductVersion -ne '1.1.2-preview') { throw "Unexpected product version: $($version.ProductVersion)" }
          if ($version.FileDescription -ne 'WinServiceManager') { throw "Unexpected description: $($version.FileDescription)" }
          if ($version.CompanyName -ne 'rampageX') { throw "Unexpected company: $($version.CompanyName)" }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon -or $icon.Width -le 0) { throw 'EXE icon resource missing' }
          $icon.Dispose()
          Write-Host "Explorer metadata OK: $($version.FileDescription) / $($version.FileVersion) / $($version.ProductVersion)"
          Write-Host 'EXE icon resource OK'
      - name: Verify embedded UAC elevation manifest
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'bin/Release/WinServiceManager.exe').Path
          $kits = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Windows Kits\10\bin'
          $mt = Get-ChildItem -Path "$kits\*\x64\mt.exe" -ErrorAction Stop | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mt) { throw 'Windows SDK manifest tool not found' }
          $out = Join-Path $env:RUNNER_TEMP 'WinServiceManager.embedded.manifest'
          & $mt.FullName "-inputresource:$exe;#1" "-out:$out"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$manifest = Get-Content -LiteralPath $out -Raw
          $level = $manifest.SelectSingleNode("//*[local-name()='requestedExecutionLevel']")
          if (-not $level -or $level.level -ne 'requireAdministrator' -or $level.uiAccess -ne 'false') { throw 'Missing or incorrect embedded UAC execution level' }
          Write-Host 'PASS: embedded EXE manifest requireAdministrator; uiAccess=false'
      - name: Package portable preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item 'bin/Release/WinServiceManager.exe' dist/
          Copy-Item 'LICENSE' dist/
          Copy-Item 'README.md' dist/
          Get-FileHash 'dist/WinServiceManager.exe' -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: WinServiceManager-Dark-Preview
          path: dist/
          if-no-files-found: error
          retention-days: 14
