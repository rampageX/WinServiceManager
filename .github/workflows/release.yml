name: Release WinServiceManager v1.1.1

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: winservicemanager-release-v1.1.1
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'rampageX/WinServiceManager'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Enable MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Guard release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/master') { throw 'Stable release must come from master' }
          $tag = git ls-remote --tags origin 'refs/tags/v1.1.1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not [string]::IsNullOrWhiteSpace(($tag | Out-String))) { throw 'Tag v1.1.1 already exists; refusing overwrite' }
      - name: Compile Release
        shell: pwsh
        run: |
          msbuild WinServiceManager.sln /m /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU" /p:WarningLevel=4 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'bin/Release/WinServiceManager.exe')) { throw 'Missing executable' }
      - name: Regression - dark dropdown dismissal
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET/Framework/v4.0.30319/csc.exe'
          & $csc /nologo /target:exe /out:bin/Release/DropdownDismissalSmoke.exe /r:bin/Release/WinServiceManager.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll './Tests\DropdownDismissalSmoke.cs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./bin/Release/DropdownDismissalSmoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Regression - startup grid and double buffering
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET/Framework/v4.0.30319/csc.exe'
          & $csc /nologo /target:exe /out:bin/Release/StartupGridSmoke.exe /r:bin/Release/WinServiceManager.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.ServiceProcess.dll './Tests\StartupGridSmoke.cs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./bin/Release/StartupGridSmoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify EXE identity
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'bin/Release/WinServiceManager.exe').Path
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($version.FileVersion -ne '1.1.1.0') { throw "Unexpected file version $($version.FileVersion)" }
          if ($version.ProductVersion -ne '1.1.1') { throw "Unexpected product version $($version.ProductVersion)" }
          if ($version.FileDescription -ne 'WinServiceManager') { throw 'Wrong file description' }
          if ($version.CompanyName -ne 'rampageX') { throw 'Wrong company' }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon -or $icon.Width -le 0) { throw 'Missing EXE icon' }
          $icon.Dispose()
          Write-Host "Verified $($version.FileDescription) $($version.FileVersion) $($version.ProductVersion)"
      - name: Create portable stable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package,dist | Out-Null
          Copy-Item bin/Release/WinServiceManager.exe package/
          Copy-Item README.md, LICENSE package/
          $zip = 'dist/WinServiceManager_v1.1.1_Stable.zip'
          Compress-Archive -Path package/* -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw 'Stable package missing' }
          Get-FileHash -Path $zip -Algorithm SHA256 | Format-List
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.1 'dist/WinServiceManager_v1.1.1_Stable.zip' --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'WinServiceManager v1.1.1' --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release view v1.1.1 --repo "$env:GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets,url --jq '{tag: .tagName, draft: .isDraft, prerelease: .isPrerelease, assets: [.assets[].name], url: .url}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
